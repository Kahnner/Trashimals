name: Build Gallery JSON Files

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-gallery:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Generate gallery JSON files
        shell: bash
        run: |
          set -e

          mkdir -p assets/gallery-archive
          mkdir -p assets/gallery-2026

          build_json() {
            folder="$1"
            output="$2"

            echo "[" > "$output"

            first=true

            while IFS= read -r -d '' file; do
              if [ "$first" = false ]; then
                echo "," >> "$output"
              fi

              first=false

              clean_path="${file#./}"
              printf '  "%s"' "$clean_path" >> "$output"
            done < <(
              find "$folder" -maxdepth 1 -type f \
                \( -iname "*.jpg" -o -iname "*.jpeg" -o -iname "*.png" -o -iname "*.webp" -o -iname "*.gif" \) \
                -print0 | sort -z
            )

            echo "" >> "$output"
            echo "]" >> "$output"
          }

          build_json "assets/gallery-archive" "assets/gallery-archive.json"
          build_json "assets/gallery-2026" "assets/gallery-2026.json"

      - name: Commit gallery JSON files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          git add assets/gallery-archive.json assets/gallery-2026.json

          git diff --cached --quiet || git commit -m "Auto-update gallery collections"
          git push
